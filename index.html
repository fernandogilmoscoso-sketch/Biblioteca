/* ── TOKENS ─────────────────────────────────────────── */

/* ── LOGIN SCREEN ───────────────────────────────────── */

.panel {

#toast.show { opacity:1; }

@media (max-width: 900px) {

<script>

  { code:'RF', name:'Referencia',                  color:'#5A5A5A', short:'Referencia' },
  { code:'OT', name:'Otros',                       color:'#6B6B6B', short:'Otros' },

const state = {
  view: 'dashboard',
  userId: null,
  books: [],
  loans: [],
  sections: [],
};

// ─────────────────────────────────────────────────────
// FIREBASE FUNCTIONS
// ─────────────────────────────────────────────────────
async function getBooks() {
  if (state.userId) {
    const { getDocs, collection, query, where } = window.firebaseReady;
    const db = window.firebaseReady.db;
    const q = query(collection(db, 'books'), where('userId', '==', state.userId));
    const snap = await getDocs(q);
    state.books = snap.docs.map(d => ({id: d.id, ...d.data()}));
  } else {
    state.books = JSON.parse(localStorage.getItem('biblioteca_books')) || [];
  }
  return state.books;
}

async function addBook(data) {
  const id = uid();
  data.id = id;
  data.dateAdded = new Date().toISOString();

  if (state.userId) {
    const { setDoc, doc } = window.firebaseReady;
    const db = window.firebaseReady.db;
    data.userId = state.userId;
    await setDoc(doc(db, 'books', id), data);
  } else {
    state.books.push(data);
    localStorage.setItem('biblioteca_books', JSON.stringify(state.books));
  }

  await getBooks();
  return data;
}

async function updateBook(id, data) {
  if (state.userId) {
    const { updateDoc, doc } = window.firebaseReady;
    const db = window.firebaseReady.db;
    await updateDoc(doc(db, 'books', id), data);
  } else {
    const idx = state.books.findIndex(b => b.id === id);
    if (idx !== -1) {
      state.books[idx] = {...state.books[idx], ...data};
      localStorage.setItem('biblioteca_books', JSON.stringify(state.books));
    }
  }
  await getBooks();
}

async function deleteBook(id) {
  if (state.userId) {
    const { deleteDoc, doc } = window.firebaseReady;
    const db = window.firebaseReady.db;
    await deleteDoc(doc(db, 'books', id));
  } else {
    state.books = state.books.filter(b => b.id !== id);
    localStorage.setItem('biblioteca_books', JSON.stringify(state.books));
  }
  await getBooks();
}

async function getLoans() {
  if (state.userId) {
    const { getDocs, collection, query, where } = window.firebaseReady;
    const db = window.firebaseReady.db;
    const q = query(collection(db, 'loans'), where('userId', '==', state.userId));
    const snap = await getDocs(q);
    state.loans = snap.docs.map(d => ({id: d.id, ...d.data()}));
  } else {
    state.loans = JSON.parse(localStorage.getItem('biblioteca_loans')) || [];
  }
  return state.loans;
}

async function addLoan(data) {
  const id = uid();
  data.id = id;
  data.created = new Date().toISOString();

  if (state.userId) {
    const { setDoc, doc } = window.firebaseReady;
    const db = window.firebaseReady.db;
    data.userId = state.userId;
    await setDoc(doc(db, 'loans', id), data);
  } else {
    state.loans.push(data);
    localStorage.setItem('biblioteca_loans', JSON.stringify(state.loans));
  }

  await getLoans();
  updateSidebarStats();
}

async function updateLoan(id, data) {
  if (state.userId) {
    const { updateDoc, doc } = window.firebaseReady;
    const db = window.firebaseReady.db;
    await updateDoc(doc(db, 'loans', id), data);
  } else {
    const idx = state.loans.findIndex(l => l.id === id);
    if (idx !== -1) {
      state.loans[idx] = {...state.loans[idx], ...data};
      localStorage.setItem('biblioteca_loans', JSON.stringify(state.loans));
    }
  }
  await getLoans();
  updateSidebarStats();
}

// ─────────────────────────────────────────────────────
// UTILITIES
// ─────────────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function fmtDate(s) {
  if (!s) return '—';
  return new Date(s).toLocaleDateString('es-CO', {day:'2-digit',month:'2-digit',year:'numeric'});
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg, dur=2800) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

function sec(code) {
  return SECTIONS.find(s => s.code === code) || {code, name:'Desconocido', color:'#666', short:code};
}

function locCode(section, shelf, pos) {
  if (!section) return '';
  return `${section}-${String(shelf||'?')}-${String(pos||'??').padStart(2,'0')}`;
}

function isOverdue(loan) {
  return loan.status === 'active' && loan.expectedReturn && new Date(loan.expectedReturn) < new Date();
}

// ─────────────────────────────────────────────────────
// AUTH
// ─────────────────────────────────────────────────────
async function toggleAuth() {
  if (state.userId) {
    await handleLogout();
  } else {
    await handleGoogleLogin();
  }
}

async function handleGoogleLogin() {
  const btn = document.getElementById('auth-btn');
  btn.disabled = true;
  btn.textContent = 'Conectando...';

  try {
    const { auth, GoogleAuthProvider, signInWithPopup } = window.firebaseReady;
    const provider = new GoogleAuthProvider();
    const result = await signInWithPopup(auth, provider);
    state.userId = result.user.uid;
    document.getElementById('user-display-name').textContent = result.user.displayName || 'Usuario';
    await loadAllData();
    updateAuthButton();
    toast('¡Bienvenido! Datos sincronizados en la nube');
  } catch(err) {
    console.error(err);
    toast('Error: ' + err.message);
    btn.disabled = false;
  }
}

async function handleLogout() {
  if (!confirm('¿Cerrar sesión?')) return;
  try {
    const { auth, signOut } = window.firebaseReady;
    await signOut(auth);
    state.userId = null;
    state.books = [];
    state.loans = [];
    await loadAllData();
    updateAuthButton();
    toast('Sesión cerrada. Los datos ahora se guardan localmente');
  } catch(err) {
    toast('Error al cerrar sesión');
  }
}

function updateAuthButton() {
  const btn = document.getElementById('auth-btn');
  const name = document.getElementById('user-display-name');
  const status = document.getElementById('sync-status');
  if (state.userId) {
    btn.textContent = 'Cerrar sesión';
    status.textContent = 'En la nube ☁️';
  } else {
    btn.textContent = 'Acceder con Google';
    name.textContent = 'Sin cuenta';
    status.textContent = 'Local 💾';
  }
  btn.disabled = false;
}

async function loadAllData() {
  await getBooks();
  await getLoans();
  updateSidebarStats();
}

async function updateSidebarStats() {
  const al = state.loans.filter(l => l.status === 'active');
  document.getElementById('sb-total').textContent = state.books.length;
  document.getElementById('sb-loans').textContent = al.length;
}

// ─────────────────────────────────────────────────────
// NAVIGATION & RENDERING
// ─────────────────────────────────────────────────────
function navigate(view) {
  state.view = view;
  document.querySelectorAll('.nav-item').forEach(el =>
    el.classList.toggle('active', el.dataset.view === view));
  renderView();
}

async function renderView() {
  const mc = document.getElementById('main-content');
  let html = '';

  if (state.view === 'dashboard') {
    html = await renderDashboard();
  } else if (state.view === 'catalog') {
    html = await renderCatalog();
  } else if (state.view === 'register') {
    html = await renderRegister();
  } else if (state.view === 'loans') {
    html = await renderLoans();
  }

  mc.innerHTML = html;
}

// ─────────────────────────────────────────────────────
// VIEWS
// ─────────────────────────────────────────────────────
async function renderDashboard() {
  const books = state.books;
  const loans = state.loans;
  const al = loans.filter(l => l.status === 'active');
  const od = al.filter(isOverdue);
  const recent = books.slice(0,5);

  return `
  <div class="view-header">
    <div>
      <div class="view-eyebrow">Panel principal</div>
      <h1 class="view-title">Mi Biblioteca ☁️</h1>
    </div>
    <button class="btn btn-primary" onclick="navigate('register')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Registrar libro
    </button>
  </div>

  ${od.length ? `<div class="alert alert-warning">
    <strong>${od.length} préstamo${od.length>1?'s':''}</strong> con devolución vencida
  </div>` : ''}

  <div class="stat-grid">
    <div class="stat-card"><div class="stat-label">Total libros</div><div class="stat-value">${books.length}</div><div class="stat-sub">registrados</div></div>
    <div class="stat-card"><div class="stat-label">En préstamo</div><div class="stat-value">${al.length}</div><div class="stat-sub">${od.length?`${od.length} vencidos`:''}</div></div>
    <div class="stat-card"><div class="stat-label">Préstamos activos</div><div class="stat-value">${loans.length}</div><div class="stat-sub">total</div></div>
    <div class="stat-card"><div class="stat-label">Estado</div><div class="stat-value">${state.userId?'☁️':'💾'}</div><div class="stat-sub">${state.userId?'En la nube':'Local'}</div></div>
  </div>

  <div class="panel">
    <div class="panel-header"><h2 class="panel-title">Últimos ingresos</h2></div>
    ${!recent.length ? `<div class="empty-state-small">Sin libros. <button style="background:none;border:none;color:var(--accent);cursor:pointer;" onclick="navigate('register')">Registra el primero.</button></div>` :
      recent.map(b => {
        const s = sec(b.section);
        const loan = state.loans.find(l => l.bookId === b.id && l.status === 'active');
        return `<div style="padding:10px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px">
          <div style="width:28px;height:28px;border-radius:4px;background:${s.color};color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">${s.code}</div>
          <div style="flex:1"><div style="font-size:13px;font-weight:500">${esc(b.title)}</div><div style="font-size:11px;color:var(--text-muted)">${esc(b.author||'')}</div></div>
          ${loan?'<span style="background:var(--gold-dim);color:var(--gold);padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600">Prestado</span>':''}
        </div>`;
      }).join('')}
  </div>
  `;
}

async function renderCatalog() {
  const books = state.books;

  return `
  <div class="view-header">
    <div>
      <div class="view-eyebrow">Colección</div>
      <h1 class="view-title">Catálogo <span style="background:var(--surface2);color:var(--text-muted);font-size:14px;font-family:var(--font-m);padding:2px 8px;border-radius:99px;margin-left:6px">${books.length}</span></h1>
    </div>
    <button class="btn btn-primary" onclick="navigate('register')">➕ Registrar libro</button>
  </div>

  <div class="panel">
    ${!books.length ? `<div class="empty-state"><p>Tu biblioteca está vacía</p></div>` :
      `<table style="width:100%;border-collapse:collapse">
        <thead><tr style="background:var(--surface2);border-bottom:1px solid var(--border)"><th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase">Título</th><th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase">Autor</th><th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase">Sección</th></tr></thead>
        <tbody>
          ${books.map(b => {
            const s = sec(b.section);
            return `<tr style="border-bottom:1px solid var(--border)"><td style="padding:10px 14px">${esc(b.title)}</td><td style="padding:10px 14px">${esc(b.author||'')}</td><td style="padding:10px 14px"><span style="background:${s.color};color:#fff;padding:2px 8px;border-radius:3px;font-size:9px;font-weight:700">${s.code}</span></td></tr>`;
          }).join('')}
        </tbody>
      </table>`}
  </div>
  `;
}

async function renderRegister() {
  return `
  <div class="view-header">
    <div>
      <div class="view-eyebrow">Nuevo libro</div>
      <h1 class="view-title">Registrar libro</h1>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header"><h2 class="panel-title">Datos del libro</h2></div>
    <div style="padding:20px">
      <div style="margin-bottom:14px">
        <label style="display:block;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px">Título *</label>
        <input id="f-title" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px" placeholder="Título del libro">
      </div>
      <div style="margin-bottom:14px">
        <label style="display:block;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px">Autor *</label>
        <input id="f-author" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px" placeholder="Apellido, Nombre">
      </div>
      <div style="margin-bottom:14px">
        <label style="display:block;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px">Sección *</label>
        <select id="f-section" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px">
          <option value="">— Seleccionar —</option>
          ${SECTIONS.map(s => `<option value="${s.code}">${s.code} — ${s.name}</option>`).join('')}
        </select>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:20px" onclick="saveBook()">Guardar libro</button>
    </div>
  </div>
  `;
}

async function renderLoans() {
  const al = state.loans.filter(l => l.status === 'active');

  return `
  <div class="view-header">
    <div>
      <div class="view-eyebrow">Control de préstamos</div>
      <h1 class="view-title">Préstamos</h1>
    </div>
  </div>

  <div class="panel">
    ${!al.length ? `<div class="empty-state"><p>No hay préstamos activos</p></div>` :
      al.map(l => {
        const b = state.books.find(x => x.id === l.bookId);
        const ov = isOverdue(l);
        return `<div style="padding:14px 18px;border-bottom:1px solid var(--border)">
          <div style="font-weight:600;margin-bottom:8px">${b ? esc(b.title) : '(eliminado)'}</div>
          <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">${esc(l.borrowerName)}</div>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:13px;color:${ov?'var(--danger)':'var(--text-muted)'}">${fmtDate(l.expectedReturn)}</span>
            <button class="btn btn-sm btn-secondary" onclick="returnLoan('${l.id}')">Devuelto</button>
          </div>
        </div>`;
      }).join('')}
  </div>
  `;
}

// ─────────────────────────────────────────────────────
// BOOK OPERATIONS
// ─────────────────────────────────────────────────────
async function saveBook() {
  const title = document.getElementById('f-title')?.value.trim();
  const author = document.getElementById('f-author')?.value.trim();
  const section = document.getElementById('f-section')?.value;

  if (!title || !author || !section) {
    toast('Completa todos los campos obligatorios');
    return;
  }

  await addBook({
    title, author, section,
    locationCode: locCode(section, '', ''),
  });

  toast('Libro registrado correctamente');
  navigate('catalog');
}

async function returnLoan(loanId) {
  if (!confirm('¿Confirmar devolución?')) return;
  await updateLoan(loanId, { status: 'returned', returnDate: new Date().toISOString() });
  toast('Devolución registrada');
  renderView();
}

// ─────────────────────────────────────────────────────
// AUTH STATE LISTENER
// ─────────────────────────────────────────────────────
window.firebaseReady.onAuthStateChanged(window.firebaseReady.auth, async (user) => {
  if (user) {
    state.userId = user.uid;
    document.getElementById('user-display-name').textContent = user.displayName || 'Usuario';
    await loadAllData();
  } else {
    state.userId = null;
    await loadAllData();
  }
  updateAuthButton();
});

// ─────────────────────────────────────────────────────
// NAV HANDLER
// ─────────────────────────────────────────────────────
document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => navigate(el.dataset.view));
});

// ─────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────
(async () => {
  await loadAllData();
  navigate('dashboard');
  updateAuthButton();
})();
</script>

</body>
</html>
